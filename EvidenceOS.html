<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EvidenceOS — AI Systematic Review Platform (Device & Drug · CER/PSUR/CSR/HTA)</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}</script>
<style>
:root{--bg:#060a12;--bg2:#0e1525;--bgc:#141e33;--bgi:#0a1020;--bdr:#1e2d48;--t1:#e2e8f4;--t2:#7e90ad;--t3:#4e5f7a;--bl:#3b82f6;--cy:#06b6d4;--em:#10b981;--vi:#8b5cf6;--am:#f59e0b;--ro:#f43f5e;--or:#f97316;--gp:linear-gradient(135deg,#3b82f6,#06b6d4);--ga:linear-gradient(135deg,#8b5cf6,#06b6d4);--ge:linear-gradient(135deg,#10b981,#06b6d4);--r:12px;--rs:8px;--paper:#ffffff;--ink:#1a1a1a}
[data-theme="light"]{--bg:#eef2f8;--bg2:#ffffff;--bgc:#ffffff;--bgi:#f4f7fb;--bdr:#d6e0ee;--t1:#16233a;--t2:#51647f;--t3:#8093ad}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:4px}
a{color:var(--bl)}
.hdr{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--bg2);backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px}
.logo-i{width:34px;height:34px;background:var(--gp);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;letter-spacing:-.5px}
.logo-t{font-family:'Playfair Display',serif;font-size:22px;font-weight:800;background:var(--gp);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo-v{font-size:10px;color:var(--cy);font-weight:700;background:rgba(6,182,212,.12);padding:2px 8px;border-radius:10px}
.hdr-r{display:flex;align-items:center;gap:8px}
.api-s{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--t3)}
.api-d{width:7px;height:7px;border-radius:50%;background:var(--ro);box-shadow:0 0 8px rgba(244,63,94,.5)}
.api-d.on{background:var(--em);box-shadow:0 0 8px rgba(16,185,129,.6)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:none;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.bp{background:var(--gp);color:#fff;box-shadow:0 4px 16px rgba(59,130,246,.25)}.bp:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(59,130,246,.38)}
.bs{background:var(--bgc);color:var(--t1);border:1px solid var(--bdr)}.bs:hover{border-color:var(--bl)}
.bac{background:var(--ga);color:#fff}.bgo{background:var(--ge);color:#fff;box-shadow:0 4px 16px rgba(16,185,129,.25)}
.bdang{background:rgba(244,63,94,.12);color:var(--ro);border:1px solid rgba(244,63,94,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none}
.bsm{padding:6px 11px;font-size:11px}.blg{padding:13px 28px;font-size:14px;border-radius:10px}
.icobtn{width:34px;height:34px;border-radius:8px;background:var(--bgc);border:1px solid var(--bdr);color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:.2s}.icobtn:hover{border-color:var(--bl);color:var(--t1)}
.fg{margin-bottom:13px}
.fl{display:block;font-size:11px;font-weight:600;color:var(--t2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
input[type=text],input[type=number],input[type=password],input[type=email],textarea,select{width:100%;background:var(--bgi);border:1px solid var(--bdr);border-radius:var(--rs);padding:10px 13px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--t1);outline:none;transition:.2s}
input:focus,textarea:focus,select:focus{border-color:var(--bl);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
textarea{resize:vertical;min-height:62px;line-height:1.55}
.card{background:var(--bgc);border:1px solid var(--bdr);border-radius:var(--r);padding:20px;margin-bottom:16px}
.ct{font-size:15px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.cdesc{font-size:12px;color:var(--t3);margin-bottom:14px;line-height:1.5}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.cg2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sr{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px}
.sc{background:var(--bgc);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;text-align:center}
.sv{font-size:26px;font-weight:800;background:var(--gp);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
.sl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-top:4px;font-weight:600}
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--bdr)}
.dt{width:100%;border-collapse:collapse;font-size:11px}
.dt th{text-align:left;padding:9px 10px;background:var(--bg2);border-bottom:2px solid var(--bdr);font-weight:700;color:var(--t2);text-transform:uppercase;font-size:9px;letter-spacing:.5px;position:sticky;top:0}
.dt td{padding:8px 10px;border-bottom:1px solid var(--bdr);vertical-align:top}
.dt tr:hover td{background:rgba(59,130,246,.04)}
.mono{font-family:'DM Mono',monospace}
.iedit{background:var(--bgi);border:1px solid var(--bdr);border-radius:5px;padding:4px 7px;font-family:'DM Mono',monospace;font-size:11px;color:var(--t1);width:74px;outline:none}.iedit:focus{border-color:var(--bl)}
.tabs{display:flex;border-bottom:1px solid var(--bdr);margin-bottom:16px;gap:2px;overflow-x:auto}
.tab{padding:8px 14px;border:none;background:none;color:var(--t3);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;transition:.2s;white-space:nowrap}
.tab.on{color:var(--bl);border-bottom-color:var(--bl)}
.tc{display:none}.tc.on{display:block;animation:fi .35s}
.pb{height:5px;background:var(--bg2);border-radius:3px;overflow:hidden;margin:8px 0}
.pf{height:100%;background:var(--gp);border-radius:3px;transition:width .5s ease;width:0}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--bdr);border-top-color:var(--bl);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:8px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.b-inc{background:rgba(16,185,129,.14);color:var(--em)}.b-exc{background:rgba(244,63,94,.14);color:var(--ro)}.b-may{background:rgba(245,158,11,.14);color:var(--am)}.b-pend{background:rgba(126,144,173,.14);color:var(--t2)}
.b-low{background:rgba(16,185,129,.14);color:var(--em)}.b-mod{background:rgba(245,158,11,.14);color:var(--am)}.b-high{background:rgba(244,63,94,.14);color:var(--ro)}.b-ni{background:rgba(126,144,173,.14);color:var(--t2)}
.conf{display:inline-flex;padding:1px 6px;border-radius:5px;font-size:9px;font-weight:700;font-family:'DM Mono',monospace}
.conf-high{background:rgba(16,185,129,.12);color:var(--em)}.conf-medium{background:rgba(245,158,11,.12);color:var(--am)}.conf-low{background:rgba(244,63,94,.12);color:var(--ro)}
.notif{position:fixed;bottom:20px;right:20px;padding:11px 18px;border-radius:var(--r);font-size:12px;font-weight:500;z-index:400;animation:fi .3s;display:flex;align-items:center;gap:8px;box-shadow:0 16px 48px rgba(0,0,0,.4);max-width:420px}
.notif.ok{background:var(--em);color:#fff}.notif.er{background:var(--ro);color:#fff}.notif.in{background:var(--bl);color:#fff}.notif.wn{background:var(--am);color:#fff}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;align-items:center;justify-content:center;padding:20px}.ov.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--r);padding:24px;max-width:860px;width:100%;max-height:88vh;overflow-y:auto}
.modal h2{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:14px}
.layout{display:flex;margin-top:56px;min-height:calc(100vh - 56px)}
.side{width:236px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bdr);padding:14px 10px;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
.side-h{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;font-weight:700;padding:8px 10px 6px}
.nav-i{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--rs);cursor:pointer;transition:.15s;font-size:12px;font-weight:500;color:var(--t2);margin-bottom:2px}
.nav-i:hover{background:var(--bgc)}
.nav-i.on{background:rgba(59,130,246,.1);color:var(--bl);font-weight:600}
.nav-i.done .nav-n{background:var(--em);border-color:var(--em);color:#fff}
.nav-n{width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;border:1.5px solid var(--bdr);flex-shrink:0;transition:.2s}
.nav-i.on .nav-n{border-color:var(--bl);color:var(--bl)}
.nav-i.locked{opacity:.45;cursor:not-allowed}
.main{flex:1;padding:22px;max-width:1280px;margin:0 auto;width:100%}
.stage{display:none;animation:fi .35s}.stage.on{display:block}
.stage-h{margin-bottom:18px}
.stage-t{font-family:'Playfair Display',serif;font-size:25px;font-weight:800;margin-bottom:4px}
.stage-d{font-size:12.5px;color:var(--t3);line-height:1.5;max-width:760px}
.pico-g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.pico-c{background:var(--bgi);border:1px solid var(--bdr);border-radius:var(--r);padding:14px}
.pico-l{font-family:'Playfair Display',serif;font-size:30px;font-weight:800;margin-bottom:2px}
.pico-lb{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:600}
.crit-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:7px}
.crit-row .iditag{font-family:'DM Mono',monospace;font-size:9px;background:var(--bgi);border:1px solid var(--bdr);border-radius:5px;padding:5px 7px;color:var(--cy);white-space:nowrap;margin-top:1px}
.dbgrid{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.dbt{display:flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid var(--bdr);border-radius:var(--rs);cursor:pointer;transition:.15s;font-size:12px;user-select:none;background:var(--bgi)}
.dbt.on{border-color:var(--bl);background:rgba(59,130,246,.08);color:var(--bl);font-weight:600}
.dbt .dbck{width:15px;height:15px;border:1.5px solid var(--t3);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.dbt.on .dbck{background:var(--bl);border-color:var(--bl)}
.drop{border:2px dashed var(--bdr);border-radius:var(--r);padding:34px;text-align:center;cursor:pointer;transition:.2s;color:var(--t3)}
.drop:hover,.drop.dragover{border-color:var(--bl);background:rgba(59,130,246,.04);color:var(--t2)}
.scrd{background:var(--bgc);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;margin-bottom:8px;transition:.2s}
.scrd.si{border-left:4px solid var(--em)}.scrd.se{border-left:4px solid var(--ro)}.scrd.sm{border-left:4px solid var(--am)}.scrd.sp{border-left:4px solid var(--t3)}
.scrd-t{font-size:13px;font-weight:600;margin-bottom:4px;line-height:1.35}
.scrd-m{font-size:10px;color:var(--t3);margin-bottom:6px;font-family:'DM Mono',monospace}
.scrd-a{font-size:11.5px;color:var(--t2);line-height:1.55;margin-bottom:8px;max-height:60px;overflow:hidden;transition:max-height .3s}
.scrd-a.exp{max-height:600px}
.scrd-j{font-size:10.5px;color:var(--cy);background:var(--bgi);border-radius:6px;padding:7px 9px;margin-bottom:8px;line-height:1.5}
.scrd-btns{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.sb{padding:4px 11px;border-radius:6px;border:1px solid;font-size:10px;font-weight:600;cursor:pointer;background:transparent;transition:.15s}
.sb-i{border-color:var(--em);color:var(--em)}.sb-i:hover,.sb-i.on{background:var(--em);color:#fff}
.sb-e{border-color:var(--ro);color:var(--ro)}.sb-e:hover,.sb-e.on{background:var(--ro);color:#fff}
.sb-m{border-color:var(--am);color:var(--am)}.sb-m:hover,.sb-m.on{background:var(--am);color:#fff}
.aip{display:flex;align-items:center;gap:8px;padding:10px 13px;background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.16);border-radius:var(--r);margin:10px 0;font-size:11px;color:var(--bl)}
.warn{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.22);border-radius:var(--r);padding:11px 13px;margin:10px 0;font-size:11.5px;color:var(--am);line-height:1.5}
.info{background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.18);border-radius:var(--r);padding:11px 13px;margin:10px 0;font-size:11.5px;color:var(--t2);line-height:1.55}
.cb{background:var(--bgi);border:1px solid var(--bdr);border-radius:var(--rs);padding:11px;font-family:'DM Mono',monospace;font-size:11px;overflow-x:auto;white-space:pre-wrap;color:var(--cy);line-height:1.5;word-break:break-word}
.dblink{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bgi);border:1px solid var(--bdr);border-radius:var(--rs);padding:10px 12px;margin-bottom:7px}
.dblink-l{font-size:12px;font-weight:600}
.dblink .q{font-size:10px;color:var(--t3);font-family:'DM Mono',monospace;margin-top:3px;word-break:break-all;max-width:640px}
.rob-grid{display:grid;grid-template-columns:auto repeat(auto-fit,minmax(60px,1fr)) auto;gap:0;font-size:10px}
.score-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:9px;font-size:10px;font-weight:700}
.auto-step{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--rs);transition:.3s;font-size:12.5px;border:1px solid transparent;margin-bottom:4px}
.auto-step.run{background:rgba(59,130,246,.08);border-color:rgba(59,130,246,.2)}
.auto-step.done{background:rgba(16,185,129,.05);border-color:rgba(16,185,129,.15)}
.auto-step.err{background:rgba(244,63,94,.06);border-color:rgba(244,63,94,.18)}
.auto-step.pend{opacity:.45}
.as-ico{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;border:2px solid var(--bdr);background:var(--bg)}
.auto-step.done .as-ico{background:var(--em);border-color:var(--em);color:#fff}
.auto-step.run .as-ico{border-color:var(--bl);color:var(--bl)}
.auto-step.err .as-ico{background:var(--ro);border-color:var(--ro);color:#fff}
.as-nm{font-weight:600;flex:1}.as-st{font-size:10px;color:var(--t3);font-family:'DM Mono',monospace}
.rp{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:40px;max-height:680px;overflow-y:auto;font-size:13px;line-height:1.7;font-family:'DM Sans',sans-serif}
.rp h1{font-size:22px;margin-bottom:12px;font-family:'Playfair Display',serif;color:#111}
.rp h2{font-size:16px;margin:22px 0 9px;border-bottom:2px solid #e5e5e5;padding-bottom:6px;color:#1a1a1a}
.rp h3{font-size:14px;margin:15px 0 6px;color:#333}
.rp p{margin-bottom:10px;color:#2a2a2a}.rp ul,.rp ol{margin:8px 0 10px 22px;color:#2a2a2a}.rp li{margin-bottom:4px}
.rp table{width:100%;border-collapse:collapse;margin:13px 0;font-size:11px}
.rp th,.rp td{border:1px solid #d5d5d5;padding:6px 9px;text-align:left}.rp th{background:#f3f5f8;font-weight:700}
.rp blockquote{border-left:3px solid #3b82f6;padding:6px 14px;margin:10px 0;color:#444;background:#f7f9fc;font-style:italic}
.svgwrap{background:var(--paper);border-radius:var(--r);padding:18px;margin:10px 0;overflow-x:auto}
.toggle{position:relative;width:42px;height:23px;background:var(--bgi);border:1px solid var(--bdr);border-radius:12px;cursor:pointer;transition:.2s}
.toggle.on{background:var(--bl);border-color:var(--bl)}
.toggle .knob{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on .knob{left:21px}
.rowflex{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.mut{color:var(--t3);font-size:11px}
.kpi{display:inline-flex;align-items:baseline;gap:5px}.kpi b{font-size:15px;color:var(--t1)}
.chip{display:inline-flex;padding:3px 9px;border-radius:7px;font-size:10px;font-weight:600;background:var(--bgi);border:1px solid var(--bdr);color:var(--t2);margin:2px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.seg{display:inline-flex;background:var(--bgi);border:1px solid var(--bdr);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 16px;border:none;border-radius:8px;background:transparent;color:var(--t2);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:.2s}
.seg button.on{background:var(--gp);color:#fff;box-shadow:0 2px 10px rgba(59,130,246,.3)}
.seg.dom button.on{background:var(--ge)}
.errbar{background:rgba(244,63,94,.1);border:1px solid var(--ro);border-radius:var(--r);padding:16px;margin:14px 0;color:var(--ro);font-size:13px;line-height:1.6}
.errbar code{background:rgba(0,0,0,.25);padding:2px 6px;border-radius:4px;font-family:'DM Mono',monospace;font-size:11px}
.dd{position:relative}
.dd-menu{display:none;position:absolute;top:100%;left:0;right:0;z-index:30;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--rs);margin-top:4px;padding:8px;max-height:240px;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.dd-menu.open{display:block}
.dd-opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px}
.dd-opt:hover{background:var(--bgc)}
.dd-opt .ck{width:15px;height:15px;border:1.5px solid var(--t3);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.dd-opt.on .ck{background:var(--bl);border-color:var(--bl)}
.dd-btn{cursor:pointer;display:flex;align-items:center;justify-content:space-between}
@media(max-width:900px){.side{display:none}.pico-g{grid-template-columns:1fr 1fr}.cg2,.split{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="hdr">
  <div class="logo"><div class="logo-i">Eo</div><span class="logo-t">EvidenceOS</span><span class="logo-v" id="domBadge">Device · SLR</span></div>
  <div class="hdr-r">
    <div class="seg" id="modeSeg" title="Run the pipeline automatically or review every step (human-in-the-loop)"><button id="modeStep" class="on" onclick="setMode('stepwise')">Step-by-Step</button><button id="modeAuto" onclick="setMode('autopilot')">Autopilot</button></div>
    <div class="api-s"><div class="api-d" id="apiDot"></div><span id="apiTxt">No API key</span></div>
    <button class="icobtn" onclick="toggleTheme()" title="Toggle theme" id="themeBtn">☀️</button>
    <button class="btn bsm bs" onclick="openModal('settings')">⚙ Settings</button>
    <button class="btn bsm bs" onclick="saveCheckpoint()" title="Download checkpoint">💾 Save</button>
  </div>
</header>

<div class="layout">
  <aside class="side">
    <div class="side-h">Pipeline</div>

/* robust JSON extraction fallback (structured output should already be clean) */
function parseJSONLoose(raw){
 if(raw==null)return null;
 if(typeof raw==='object')return raw;
 try{return JSON.parse(raw)}catch(e){}
 var c=String(raw).replace(/```json/gi,'').replace(/```/g,'').trim();
 try{return JSON.parse(c)}catch(e){}
 var m=c.match(/[\[{][\s\S]*[\]}]/);if(m){try{return JSON.parse(m[0])}catch(e){}}
 try{return JSON.parse(c.replace(/,\s*([}\]])/g,'$1'))}catch(e){}
 return null;
}

/* ====================== CLAUDE API LAYER ====================== */
function apiKey(){return S._key||localStorage.getItem('litai7_key')||''}

function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}

/* core call: opts={system,user,schema,thinking,maxTokens,model,signal}
   returns parsed object (if schema) or string (text). Implements retry w/ backoff. */
async function callClaude(opts){
 var key=apiKey();
 if(!key) throw new Error('No API key set. Open Settings and paste your Claude API key.');
 var body={
   model: opts.model||apiModel(),
   max_tokens: opts.maxTokens||4096,
   messages:[{role:'user',content:opts.user}]
 };
 if(opts.system) body.system=[{type:'text',text:opts.system,cache_control:{type:'ephemeral'}}];
 if(opts.schema) body.output_config={format:{type:'json_schema',schema:opts.schema}};
 if(opts.thinking) body.thinking={type:'adaptive'};
 var delays=[0,2000,4000,8000,16000];
 var lastErr;
 for(var attempt=0;attempt<delays.length;attempt++){
   if(delays[attempt]) await sleep(delays[attempt]);
   try{
     var r=await fetch('https://api.anthropic.com/v1/messages',{
       method:'POST',
       headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
       body:JSON.stringify(body),
       signal:opts.signal
     });
     if(r.status===429||r.status===529||r.status>=500){
       lastErr=new Error('Transient API error '+r.status+' (retrying)');continue;
     }
     if(!r.ok){
       var ed={};try{ed=await r.json()}catch(e){}
       throw new Error((ed.error&&ed.error.message)||('API error '+r.status));
     }
     var data=await r.json();
     if(data.stop_reason==='refusal'){throw new Error('Model declined this request (refusal).');}
     var text=(data.content||[]).filter(function(b){return b.type==='text'}).map(function(b){return b.text}).join('');
     if(data.stop_reason==='max_tokens'){/* may be truncated; structured parse may still work */}
     if(opts.schema){var o=parseJSONLoose(text);if(o==null)throw new Error('Could not parse structured response');return o;}
     return text;
   }catch(e){
     if(e.name==='AbortError')throw e;
     lastErr=e;
     // for non-network 4xx (non-retryable) thrown above, break
     if(/API error 4/.test(e.message)||/refusal/.test(e.message)||/parse structured/.test(e.message)) throw e;
   }
 }
 throw lastErr||new Error('API call failed after retries');
}

/* ====================== STATISTICS ENGINE ====================== */
function erf(x){var s=x<0?-1:1;x=Math.abs(x);var t=1/(1+0.3275911*x);var y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y}
function normCDF(z){return 0.5*(1+erf(z/Math.SQRT2))}
function normP2(z){return 2*(1-normCDF(Math.abs(z)))}
function gammaln(x){var c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];var y=x,t=x+5.5;t-=(x+0.5)*Math.log(t);var s=1.000000000190015;for(var j=0;j<6;j++){y++;s+=c[j]/y}return -t+Math.log(2.5066282746310005*s/x)}
function gser(a,x){var ap=a,sum=1/a,del=sum;for(var n=0;n<200;n++){ap++;del*=x/ap;sum+=del;if(Math.abs(del)<Math.abs(sum)*1e-10)break}return sum*Math.exp(-x+a*Math.log(x)-gammaln(a))}
function gcf(a,x){var b=x+1-a,c=1e30,d=1/b,h=d;for(var i=1;i<200;i++){var an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-30)d=1e-30;c=b+an/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;var del=d*c;h*=del;if(Math.abs(del-1)<1e-10)break}return Math.exp(-x+a*Math.log(x)-gammaln(a))*h}
function gammq(a,x){if(x<0||a<=0)return 1;if(x<a+1)return 1-gser(a,x);return gcf(a,x)}
function chi2P(x,df){return gammq(df/2,x/2)} /* upper tail */
function betacf(a,b,x){var qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<1e-30)d=1e-30;d=1/d;var h=d;for(var m=1;m<200;m++){var m2=2*m;var aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;var del=d*c;h*=del;if(Math.abs(del-1)<1e-10)break}return h}
function ibeta(a,b,x){if(x<=0)return 0;if(x>=1)return 1;var bt=Math.exp(gammaln(a+b)-gammaln(a)-gammaln(b)+a*Math.log(x)+b*Math.log(1-x));if(x<(a+1)/(a+b+2))return bt*betacf(a,b,x)/a;return 1-bt*betacf(b,a,1-x)/b}
function tP2(t,df){var x=df/(df+t*t);return ibeta(df/2,0.5,x)} /* two-tailed */
function tCDF(t,df){var p=tP2(Math.abs(t),df);return t>0?1-p/2:p/2}
function tCrit(df,conf){if(df<1)return 1.96;var lo=0,hi=100,target=1-(1-conf)/2;for(var i=0;i<80;i++){var mid=(lo+hi)/2;if(tCDF(mid,df)<target)lo=mid;else hi=mid}return (lo+hi)/2}
function fmt(x,d){if(x==null||isNaN(x))return '—';return Number(x).toFixed(d==null?2:d)}

/* random-effects meta-analysis. studies:[{label,yi,sei}] in (log)effect space */
function metaAnalyze(studies,method){
 studies=studies.filter(function(s){return s.sei>0&&isFinite(s.yi)&&isFinite(s.sei)});
 var k=studies.length;
 if(k<1)return null;
 var wf=studies.map(function(s){return 1/(s.sei*s.sei)});
 var sumW=wf.reduce(function(a,b){return a+b},0);
 var sumWy=studies.reduce(function(a,s,i){return a+wf[i]*s.yi},0);
 var Mf=sumWy/sumW;
 var Q=studies.reduce(function(a,s,i){return a+wf[i]*(s.yi-Mf)*(s.yi-Mf)},0);
 var df=k-1;
 var sumW2=wf.reduce(function(a,w){return a+w*w},0);
 var C=sumW-sumW2/sumW;
 var tau2=C>0?Math.max(0,(Q-df)/C):0;
 if(method==='FE')tau2=0;
 var wr=studies.map(function(s){return 1/(s.sei*s.sei+tau2)});
 var sumWr=wr.reduce(function(a,b){return a+b},0);
 var Mr=studies.reduce(function(a,s,i){return a+wr[i]*s.yi},0)/sumWr;
 var seR=Math.sqrt(1/sumWr);
 var est=method==='FE'?Mf:Mr;
 var se=method==='FE'?Math.sqrt(1/sumW):seR;
 var ciLo=est-1.96*se, ciHi=est+1.96*se;
 var z=est/se, p=normP2(z);
 var I2=Q>df?Math.max(0,(Q-df)/Q*100):0;
 var H2=df>0?Q/df:1;
 var pHet=df>0?chi2P(Q,df):1;
 var tcrit=tCrit(df>0?df:1,0.95);
 var piLo=est-tcrit*Math.sqrt(tau2+se*se), piHi=est+tcrit*Math.sqrt(tau2+se*se);
 // per-study weights (random)
 var perW=method==='FE'?wf:wr; var sumPerW=perW.reduce(function(a,b){return a+b},0);
 var rows=studies.map(function(s,i){return {label:s.label,yi:s.yi,sei:s.sei,ciLo:s.yi-1.96*s.sei,ciHi:s.yi+1.96*s.sei,w:perW[i]/sumPerW*100}});
 // Egger's regression test (precision vs standardized effect)
 var egger=eggerTest(studies);
 return {k:k,est:est,se:se,ciLo:ciLo,ciHi:ciHi,z:z,p:p,tau2:tau2,Q:Q,df:df,I2:I2,H2:H2,pHet:pHet,piLo:piLo,piHi:piHi,rows:rows,egger:egger,method:method};
}
function eggerTest(studies){
 if(studies.length<3)return null;
 // regress (yi/sei) on (1/sei): intercept tests asymmetry
 var xs=studies.map(function(s){return 1/s.sei});
 var ys=studies.map(function(s){return s.yi/s.sei});
 var n=xs.length;var mx=xs.reduce(function(a,b){return a+b},0)/n;var my=ys.reduce(function(a,b){return a+b},0)/n;
 var sxx=0,sxy=0;for(var i=0;i<n;i++){sxx+=(xs[i]-mx)*(xs[i]-mx);sxy+=(xs[i]-mx)*(ys[i]-my)}
 if(sxx===0)return null;
 var slope=sxy/sxx;var icpt=my-slope*mx;
 var sse=0;for(var j=0;j<n;j++){var pred=icpt+slope*xs[j];sse+=(ys[j]-pred)*(ys[j]-pred)}
 var s2=sse/(n-2);var seInt=Math.sqrt(s2*(1/n+mx*mx/sxx));
 var t=icpt/seInt;var p=tP2(t,n-2);
 return {intercept:icpt,t:t,p:p,df:n-2};
}

function handleFile(file){
 var name=file.name.toLowerCase();
 var reader=new FileReader();
 if(name.endsWith('.xlsx')||name.endsWith('.xls')){
   reader.onload=function(ev){
     try{var wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});var ws=wb.Sheets[wb.SheetNames[0]];var arr=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});prepMapping(arr);}catch(err){notif('Excel parse failed: '+err.message,'error');}
   };reader.readAsArrayBuffer(file);
 }else if(name.endsWith('.ris')||name.endsWith('.nbib')||name.endsWith('.txt')){
   reader.onload=function(ev){var recs=parseRIS(ev.target.result,name.endsWith('.nbib'));if(recs.length){commitRecords(recs);notif('Imported '+recs.length+' records','ok');}else notif('No records found in file','warn');};reader.readAsText(file);
 }else{ // csv
   reader.onload=function(ev){try{var wb=XLSX.read(ev.target.result,{type:'string'});var ws=wb.Sheets[wb.SheetNames[0]];var arr=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});prepMapping(arr);}catch(err){notif('CSV parse failed: '+err.message,'error');}};reader.readAsText(file);
 }
}
function prepMapping(arr){
 if(!arr||arr.length<2){notif('File has no data rows','warn');return;}
 var headers=arr[0].map(function(h){return String(h).trim()});
 var rows=arr.slice(1).filter(function(r){return r.some(function(c){return String(c).trim()!==''})});
 _importBuffer={headers:headers,rows:rows};
 renderMapping();
}
function guessCol(headers,keys){for(var i=0;i<headers.length;i++){var h=headers[i].toLowerCase();for(var j=0;j<keys.length;j++){if(h.indexOf(keys[j])>=0)return i;}}return -1;}
function renderMapping(){
 var h=_importBuffer.headers;
 var fields=[['title',['title','article title','ti']],['abstract',['abstract','ab ']],['authors',['author','au']],['year',['year','publication year','py','date']],['journal',['journal','source','source title','jt']],['doi',['doi']],['pmid',['pmid','accession']]];
 var opts=function(sel){return '<option value="-1">— none —</option>'+h.map(function(c,i){return '<option value="'+i+'"'+(i===sel?' selected':'')+'>'+esc(c)+'</option>'}).join('')};
 var rows=fields.map(function(f){var g=guessCol(h,f[1]);return '<div class="rowflex"><span style="width:90px;font-weight:600;font-size:12px">'+f[0]+'</span><select id="map_'+f[0]+'">'+opts(g)+'</select></div>';}).join('');

   return rec;
 }).filter(function(r){return r.title;});
 commitRecords(recs);_importBuffer=null;notif('Imported '+recs.length+' records','ok');render();
}
function parseRIS(text,nbib){
 var recs=[];var cur=null;
 var lines=text.split(/\r?\n/);
 var tag=nbib?/^([A-Z]{2,4})\s*-\s?(.*)$/:/^([A-Z][A-Z0-9])\s{2}-\s?(.*)$/;
 lines.forEach(function(ln){
   var m=ln.match(/^([A-Z][A-Z0-9]{1,3})\s*-\s?(.*)$/);
   if(m){
     var t=m[1],v=m[2];
     if((t==='TY'||t==='PT')&&!cur){cur={id:uid(),source:$('impSrc')?$('impSrc').value:'Imported',status:'pending',title:'',abstract:'',authors:'',year:'',journal:'',doi:'',pmid:''};}
     if(!cur)cur={id:uid(),source:$('impSrc')?$('impSrc').value:'Imported',status:'pending',title:'',abstract:'',authors:'',year:'',journal:'',doi:'',pmid:''};
     if(t==='TI'||t==='T1'||t==='TON')cur.title=(cur.title?cur.title+' ':'')+v;
     else if(t==='AB')cur.abstract=(cur.abstract?cur.abstract+' ':'')+v;
     else if(t==='AU'||t==='A1'||t==='FAU')cur.authors=(cur.authors?cur.authors+'; ':'')+v;
     else if(t==='PY'||t==='Y1'||t==='DP'||t==='DA')cur.year=cur.year||(v.match(/\d{4}/)||[''])[0];
     else if(t==='JO'||t==='JF'||t==='T2'||t==='JA'||t==='TA')cur.journal=cur.journal||v;
     else if(t==='DO'||t==='LID')cur.doi=cur.doi||(v.match(/10\.\S+/)||[v])[0];
     else if(t==='PMID')cur.pmid=v;
     else if(t==='ER'){if(cur&&cur.title)recs.push(cur);cur=null;}
   }
 });
 if(cur&&cur.title)recs.push(cur);
 return recs;
}

/* ====================== STAGE 4: DEDUPLICATION ====================== */
function normTitle(t){return String(t||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
function firstAuthor(a){return String(a||'').split(/[;,]/)[0].toLowerCase().replace(/[^a-z]/g,'').slice(0,8);}
function levRatio(a,b){
 if(a===b)return 1;if(!a.length||!b.length)return 0;
 var la=a.length,lb=b.length;var d=[];for(var i=0;i<=la;i++)d[i]=[i];for(var j=0;j<=lb;j++)d[0][j]=j;
 for(i=1;i<=la;i++)for(j=1;j<=lb;j++){var c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);}
 return 1-d[la][lb]/Math.max(la,lb);
}
STAGE_RENDER.dedup=function(){
 var dups=S.records.filter(function(r){return r.dup}).length;
 var uniq=S.records.length-dups;
 return stageHead('Deduplication','Fuzzy matching on DOI, then normalised title + first-author + year. Duplicate counts are tracked in a dedicated PRISMA counter (not derived from filtered arrays), so the flow diagram is always arithmetically exact.')+
 '<div class="sr"><div class="sc"><div class="sv">'+S.records.length+'</div><div class="sl">Total imported</div></div>'+
  '<div class="sc"><div class="sv">'+dups+'</div><div class="sl">Duplicates flagged</div></div>'+
  '<div class="sc"><div class="sv">'+uniq+'</div><div class="sl">Unique records</div></div></div>'+
 '<div class="card"><div class="ct">Run deduplication</div><div class="cdesc">Adjust the title similarity threshold if needed. Records sharing a DOI are always merged.</div>'+
 '<div class="cg2"><div class="fg"><label class="fl">Title similarity threshold</label><input type="number" id="dthr" value="0.90" min="0.7" max="1" step="0.01"></div>'+
 '<div class="fg"><label class="fl">&nbsp;</label><button class="btn bp" onclick="runDedup()" style="width:100%">⧉ Detect duplicates</button></div></div></div>'+
 (dups?'<div class="card"><div class="ct">Flagged duplicates ('+dups+')</div><div class="cdesc">Review and restore any false positives.</div><div id="dupList">'+renderDupList()+'</div></div>':'')+
 '<div style="display:flex;gap:8px"><button class="btn bp" onclick="finishDedup()">Confirm & Continue to Screening →</button></div>';
};
function renderDupList(){
 return S.records.filter(function(r){return r.dup}).map(function(r){
   return '<div class="rowflex" style="border-bottom:1px solid var(--bdr)"><div><div style="font-size:12px;font-weight:600">'+esc(r.title)+'</div><div class="mut mono">dup of: '+esc((S.records.find(function(x){return x.id===r.dupOf})||{}).title||'?').slice(0,70)+'</div></div><button class="btn bs bsm" onclick="undup(\''+r.id+'\')">Not a duplicate</button></div>';
 }).join('');
}
function runDedup(){
 var thr=parseFloat($('dthr').value)||0.9;
 S.records.forEach(function(r){r.dup=false;r.dupOf=null;});
 var seenDoi={};var kept=[];
 for(var i=0;i<S.records.length;i++){
   var r=S.records[i];var doi=(r.doi||'').toLowerCase().replace(/^https?:\/\/(dx\.)?doi\.org\//,'').trim();
   var isDup=false;
   if(doi&&seenDoi[doi]){r.dup=true;r.dupOf=seenDoi[doi];isDup=true;}
   if(!isDup){
     var nt=normTitle(r.title);var fa=firstAuthor(r.authors);
     for(var k=0;k<kept.length;k++){
       var o=kept[k];
       if(normTitle(o.title)===nt){r.dup=true;r.dupOf=o.id;isDup=true;break;}
       if(nt.length>15&&levRatio(nt,normTitle(o.title))>=thr&&(!r.year||!o.year||r.year===o.year)){r.dup=true;r.dupOf=o.id;isDup=true;break;}
     }
   }
   if(!isDup){kept.push(r);if(doi)seenDoi[doi]=r.id;}
 }
 var dups=S.records.filter(function(r){return r.dup}).length;
 S.prisma.dup_removed=dups;
 persist();audit('dedup_run','threshold '+thr+', '+dups+' duplicates flagged');render();notif(dups+' duplicates flagged','ok');
}
function undup(id){var r=S.records.find(function(x){return x.id===id});if(r){r.dup=false;r.dupOf=null;S.prisma.dup_removed=S.records.filter(function(x){return x.dup}).length;persist();render();}}
function activeRecords(){return S.records.filter(function(r){return !r.dup});}
function finishDedup(){
 S.prisma.dup_removed=S.records.filter(function(r){return r.dup}).length;
 S.prisma.screened=activeRecords().length;
 markDone('dedup');audit('dedup_confirmed',activeRecords().length+' unique records to screen');goStage('screen');
}

var _screenFilter='all', _screenAbort=false;
function screenSchema(){
 var ids=S.criteria.include.map(function(c){return c.id}).concat(S.criteria.exclude.map(function(c){return c.id})).concat(['NONE']);
 return {type:'object',properties:{
   decision:{type:'string',enum:['INCLUDE','EXCLUDE']},
   criterion_violated:{type:'string',enum:ids},
   population_match:{type:'string',enum:['yes','no','unclear']},
   intervention_match:{type:'string',enum:['yes','no','unclear']},
   comparator_match:{type:'string',enum:['yes','no','unclear']},
   outcome_match:{type:'string',enum:['yes','no','unclear']},
   study_design:{type:'string'},
   confidence:{type:'string',enum:['high','medium','low']},
   rationale:{type:'string'}
 },required:['decision','criterion_violated','population_match','intervention_match','comparator_match','outcome_match','study_design','confidence','rationale'],additionalProperties:false};
}
function screenSystem(){
 var inc=S.criteria.include.map(function(c){return '  '+c.id+': '+c.text}).join('\n');
 var exc=S.criteria.exclude.map(function(c){return '  '+c.id+': '+c.text}).join('\n');
 return 'You are a senior systematic-review screener performing TITLE/ABSTRACT screening for a '+docTypeName()+', strictly following PRISMA 2020 and the Cochrane Handbook.\n\n'+domainHint()+'\n\n'+
 'REVIEW PICO:\n  Population: '+S.pico.p+'\n  Intervention: '+S.pico.i+'\n  Comparator: '+S.pico.c+'\n  Outcomes: '+S.pico.o+'\n  Timeframe: '+tfStr()+'\n  Eligible designs: '+designsStr()+'\n\n'+
 'INCLUSION CRITERIA (a record must meet ALL):\n'+inc+'\n\nEXCLUSION CRITERIA (violating ANY excludes):\n'+exc+'\n\n'+
 'DECISION RULES — apply EXACTLY and IDENTICALLY to every record:\n'+
 '1. Use ONLY the information in the supplied title and abstract. Do NOT use outside knowledge about the study, authors, or journal.\n'+
 '2. Output a BINARY decision: INCLUDE or EXCLUDE. There is no "maybe".\n'+
 '3. To EXCLUDE, set criterion_violated to the SINGLE most decisive criterion id (e.g. EXC02, or an INC id that is clearly not met). For INCLUDE, set criterion_violated to "NONE".\n'+
 '4. Conservative retention: if the abstract lacks the information needed to judge a criterion, do NOT exclude on that basis. At title/abstract stage, INCLUDE any record that cannot be confidently excluded, and set confidence to "low" so a human can review it at full text.\n'+
 '5. Set population/intervention/comparator/outcome match to yes/no/unclear based solely on the abstract.\n'+
 '6. rationale: one or two sentences citing the specific criterion and the abstract text that drove the decision. Never invent data.\n'+
 '7. Be deterministic: the same abstract must always yield the same decision.';
}

async function screenOne(id,rerender){
 var r=S.records.find(function(x){return x.id===id});if(!r)return;
 var user='TITLE: '+(r.title||'')+'\n\nABSTRACT: '+(r.abstract||'(no abstract available)');
 var o=await callClaude({system:screenSystem(),user:user,schema:screenSchema(),maxTokens:700});
 r.screen=o;

async function screenAll(reset){
 if(BUSY){notif('Already running','warn');return;}
 BUSY=true;_screenAbort=false;
 if(reset){activeRecords().forEach(function(r){r.status='pending';r.screen=null;r.override=false;});}
 var todo=activeRecords().filter(function(r){return r.status==='pending';});
 if(!todo.length){BUSY=false;notif('Nothing to screen','warn');return;}
 audit('screen_batch_start',todo.length+' records, model='+apiModel());
 var done=0,fail=0;var conc=4;
 var pf=$('scrPF'),stat=$('scrStat');
 function upd(){if(pf)pf.style.width=(done/todo.length*100)+'%';if(stat)stat.textContent=done+' / '+todo.length+' screened'+(fail?(' · '+fail+' failed'):'');}
 var queue=todo.slice();
 async function worker(){
   while(queue.length&&!_screenAbort){
     var r=queue.shift();
     try{await screenOne(r.id);}catch(e){fail++;r.status='maybe';r.screen={decision:'ERROR',confidence:'low',rationale:'Screening failed: '+e.message,criterion_violated:'NONE',population_match:'unclear',intervention_match:'unclear',comparator_match:'unclear',outcome_match:'unclear',study_design:''};}
     done++;upd();persist();
   }
 }
 var workers=[];for(var i=0;i<conc;i++)workers.push(worker());
 await Promise.all(workers);
 BUSY=false;recomputeScreenCounts();audit('screen_batch_done',done+' screened, '+fail+' failed');
 render();notif('Screening complete: '+done+' done'+(fail?', '+fail+' failed':''),fail?'warn':'ok');
}

var APPRAISAL_TOOLS={
 RoB2:{
   name:'Cochrane RoB 2 (randomised trials)',
   judg:['Low','Some concerns','High'],
   overall:['Low','Some concerns','High'],
   domains:['D1 Randomisation process','D2 Deviations from intended interventions','D3 Missing outcome data','D4 Measurement of the outcome','D5 Selection of the reported result'],
   defs:'Apply the Cochrane Risk-of-Bias 2 tool for individually randomised trials. Judge each domain Low / Some concerns / High using the signalling questions; never default to "Some concerns" when evidence is clear.\n'+
   'D1 Randomisation process — Was the allocation sequence random and adequately concealed? Were baseline groups balanced? LOW: computer-generated sequence + central/opaque-envelope concealment, balanced baseline. HIGH: non-random/predictable sequence, no concealment, or baseline imbalance suggesting a problem.\n'+
   'D2 Deviations from intended interventions — Were participants/carers blinded? Were there deviations beyond the trial context, and was analysis appropriate (ITT)? LOW: blinded or deviations balanced + ITT. HIGH: unblinded with non-protocol co-interventions, or per-protocol analysis with substantial non-adherence.\n'+
   'D3 Missing outcome data — Were outcome data available for ~all participants? LOW: <5% missing or robust sensitivity analysis. HIGH: substantial differential missingness likely related to true outcome.\n'+
   'D4 Measurement of the outcome — Was the outcome measure appropriate and assessors blinded? LOW: objective outcome or blinded assessor. HIGH: subjective outcome assessed by unblinded assessor likely influenced by group knowledge.\n'+
   'D5 Selection of the reported result — Was the result selected from multiple measurements/analyses? LOW: pre-registered protocol/SAP and reported as planned. HIGH: no protocol and clear outcome/analysis selective reporting.\n'+
   'OVERALL: Low only if ALL domains Low. Some concerns if at least one domain Some concerns but none High. High if any domain is High OR multiple domains have Some concerns substantially lowering confidence.\n'+
   'WORKED EXAMPLE: A double-blind RCT, central randomisation, 2% loss, objective mortality outcome, pre-registered — D1 Low, D2 Low, D3 Low, D4 Low, D5 Low → Overall Low. An open-label trial with patient-reported pain (unblinded) and no protocol — D4 High, D5 Some concerns → Overall High.'
 },
 'ROBINS-I':{
   name:'ROBINS-I (non-randomised studies of interventions)',
   judg:['Low','Moderate','Serious','Critical','No information'],
   overall:['Low','Moderate','Serious','Critical','No information'],
   domains:['D1 Confounding','D2 Selection of participants','D3 Classification of interventions','D4 Deviations from intended interventions','D5 Missing data','D6 Measurement of outcomes','D7 Selection of the reported result'],
   defs:'Apply ROBINS-I for non-randomised comparative studies. ROBINS-I benchmarks against a hypothetical target trial. Judge each domain Low / Moderate / Serious / Critical / No information.\n'+
   'D1 Confounding — Were important confounders controlled (design or analysis: multivariable adjustment, matching, PS methods)? LOW: comparable to a well-conducted RCT, all key confounders controlled. MODERATE: sound but residual confounding plausible. SERIOUS: key confounders uncontrolled. CRITICAL: confounding so severe results are uninterpretable.\n'+
   'D2 Selection of participants — Could selection into the study (based on post-baseline characteristics) bias results? SERIOUS if prevalent users / immortal-time bias present.\n'+
   'D3 Classification of interventions — Were intervention groups clearly defined and recorded without knowledge of outcome? SERIOUS if exposure misclassified or defined using post-outcome information.\n'+
   'D4 Deviations from intended interventions — Were there deviations from usual practice that affected the outcome? Consider co-interventions differing between groups.\n'+
   'D5 Missing data — Were outcome/exposure/confounder data reasonably complete? SERIOUS if substantial differential missingness without appropriate handling.\n'+
   'D6 Measurement of outcomes — Could outcome ascertainment differ between groups (assessors aware of intervention)? SERIOUS for subjective outcomes with non-blinded ascertainment differing by group.\n'+
   'D7 Selection of the reported result — Selective reporting from multiple outcomes/analyses/subgroups.\n'+
   'OVERALL = the most severe domain rating (Low only if all Low; Moderate if at least one Moderate and none higher; Serious/Critical if any domain reaches that level). Use "No information" only when truly unjudgeable.\n'+
   'WORKED EXAMPLE: A prospective registry comparing device A vs B, multivariable adjustment for the main confounders but residual confounding plausible, blinded objective endpoint, complete data, pre-specified analysis — D1 Moderate, others Low → Overall Moderate. Same study but unadjusted comparison with strong indication bias → D1 Serious → Overall Serious.'
 },
 JBI:{
   name:'JBI Critical Appraisal (case series / cohort)',
   judg:['Yes','No','Unclear','Not applicable'],
   overall:['Low','Moderate','High'],
   domains:['Q1 Clear inclusion criteria','Q2 Condition measured validly/reliably','Q3 Valid identification of the condition','Q4 Consecutive inclusion','Q5 Complete inclusion','Q6 Clear outcome reporting','Q7 Demographics reported','Q8 Follow-up/results clear','Q9 Site/clinic info','Q10 Appropriate statistics'],
   defs:'Apply the JBI critical appraisal checklist for case series / single-arm studies. Answer each item Yes / No / Unclear / Not applicable based only on the report. Derive an OVERALL risk-of-bias rating: Low (≥8 Yes), Moderate (5-7 Yes), High (<5 Yes). Be strict — "Unclear" is not "Yes".'
 },
 NOS:{
   name:'Newcastle-Ottawa Scale (cohort / case-control)',
   judg:['Yes','No','Unclear','Not applicable'],
   overall:['Low','Moderate','High'],
   domains:['S1 Representativeness of exposed cohort','S2 Selection of non-exposed','S3 Ascertainment of exposure','S4 Outcome not present at start','C1 Comparability (design/analysis)','O1 Assessment of outcome','O2 Adequate follow-up length','O3 Adequacy of follow-up'],
   defs:'Apply the Newcastle-Ottawa Scale (cohort version). Award a star (Yes) when the criterion is met across Selection (4), Comparability (2 via C1), and Outcome (3). Map total stars to OVERALL risk of bias: Low (7-9 stars), Moderate (4-6), High (0-3). Mark Yes when a star is awarded.'
 }
};

 var body=rows.map(function(x){var oc=x.oc;return '<tr>'+

 '</tr>';}).join('');

function findOutcome(oid){var f=null;outcomeRows().forEach(function(x){if(x.oc._id===oid)f=x;});return f;}
function editOutcome(oid,field,val){var x=findOutcome(oid);if(!x)return;x.oc[field]=val;x.oc._pool=isPoolable(x.oc);persist();}
function oc_pool(oid,on){var x=findOutcome(oid);if(x){x.oc._pool=on;persist();}}
function delOutcome(oid){var x=findOutcome(oid);if(!x)return;var arr=x.r.extraction.outcomes;arr.splice(arr.indexOf(x.oc),1);persist();render();}
function addOutcomeRow(){
 var recs=includedStudies();if(!recs.length)return;
 var r=recs[0];if(!r.extraction)r.extraction={outcomes:[]};if(!r.extraction.outcomes)r.extraction.outcomes=[];
 r.extraction.outcomes.push({_id:uid('o'),_study:r.id,name:'New outcome',effect_measure:S.effectMeasure,effect_value:'',ci_lower:'',ci_upper:'',n_intervention:'',n_comparator:'',p_value:'',source_quote:'manual entry',_pool:false});
 persist();render();

/* ====================== STAGE 9: STATISTICS & META-ANALYSIS ====================== */
var _metaResult=null,_metaRatio=false,_metaLabel='',_metaOutcome='__all__';
function isRatio(m){return ['OR','RR','HR','proportion','PROP'].indexOf((m||'').toUpperCase().replace('PROPORTION','PROP'))>=0||['OR','RR','HR'].indexOf(m)>=0;}
function distinctOutcomes(){var s={};outcomeRows().forEach(function(x){if(x.oc.name)s[x.oc.name]=1;});return Object.keys(s);}
function buildMetaStudies(){
 var rows=outcomeRows().filter(function(x){return x.oc._pool&&isPoolable(x.oc)&&(_metaOutcome==='__all__'||x.oc.name===_metaOutcome);});
 var measure=rows.length?(rows[0].oc.effect_measure&&rows[0].oc.effect_measure!=='NOT_REPORTED'?rows[0].oc.effect_measure:S.effectMeasure):S.effectMeasure;
 var ratio=isRatio(measure);
 var studies=rows.map(function(x){
   var ev=num(clean(x.oc.effect_value)),lo=num(clean(x.oc.ci_lower)),hi=num(clean(x.oc.ci_upper));
   if(ev==null||lo==null||hi==null||lo>=hi)return null;
   var yi,sei;
   if(ratio){if(ev<=0||lo<=0){return null;}yi=Math.log(ev);sei=(Math.log(hi)-Math.log(lo))/(2*1.96);}
   else{yi=ev;sei=(hi-lo)/(2*1.96);}
   return {label:studyLabel(x.r)+(x.oc.timepoint&&x.oc.timepoint!=='NOT_REPORTED'?' ('+x.oc.timepoint+')':''),yi:yi,sei:sei,raw:ev,rlo:lo,rhi:hi};
 }).filter(Boolean);
 return {studies:studies,ratio:ratio,measure:measure};
}

   '<div class="fg"><label class="fl">Outcome to pool</label><select id="metaOut" onchange="_metaOutcome=this.value;runMeta()"><option value="__all__"'+(_metaOutcome==='__all__'?' selected':'')+'>All selected rows</option>'+outs.map(function(o){return '<option value="'+esc(o)+'"'+(_metaOutcome===o?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select></div>'+
   '<div class="fg"><label class="fl">Model</label><select id="metaModel" onchange="S.metaMethod=this.value;persist();runMeta()"><option value="DL"'+(S.metaMethod==='DL'?' selected':'')+'>Random-effects (DerSimonian-Laird)</option><option value="FE"'+(S.metaMethod==='FE'?' selected':'')+'>Fixed-effect (inverse variance)</option></select></div>'+
   '<div class="fg"><label class="fl">&nbsp;</label><button class="btn bp" style="width:100%" onclick="runMeta()">∑ Run meta-analysis</button></div>'+
 '</div></div>'+
 '<div id="metaResults"></div>'+
 '<div style="display:flex;gap:8px"><button class="btn bp" onclick="markDone(\'meta\');goStage(\'prisma\')">Continue to PRISMA →</button></div>';
};
STAGE_AFTER.meta=function(){runMeta();};
function runMeta(){
 var box=$('metaResults');if(!box)return;
 var b=buildMetaStudies();
 if(b.studies.length<2){box.innerHTML='<div class="warn">Need at least 2 poolable outcome rows (effect + CI lower + CI upper). Tag rows with the "Pool" checkbox in Extraction, or add data. Currently '+b.studies.length+' poolable.</div>';_metaResult=null;return;}
 var res=metaAnalyze(b.studies,S.metaMethod);
 _metaResult=res;_metaRatio=b.ratio;_metaLabel=b.measure;res.ratio=b.ratio;res.measure=b.measure;res.outcome=_metaOutcome==='__all__'?'Pooled outcome':_metaOutcome;
 var disp=function(v){return b.ratio?Math.exp(v):v;};
 var pooled=disp(res.est),plo=disp(res.ciLo),phi=disp(res.ciHi),pilo=disp(res.piLo),pihi=disp(res.piHi);
 var hetClass=res.I2<30?'b-low':res.I2<60?'b-mod':'b-high';
 box.innerHTML=
  '<div class="sr"><div class="sc"><div class="sv">'+fmt(pooled,b.ratio?2:2)+'</div><div class="sl">Pooled '+esc(b.measure)+'</div></div>'+
   '<div class="sc"><div class="sv" style="font-size:15px;background:none;-webkit-text-fill-color:var(--t1);color:var(--t1)">'+fmt(plo)+' – '+fmt(phi)+'</div><div class="sl">95% CI</div></div>'+
   '<div class="sc"><div class="sv" style="font-size:18px;background:none;-webkit-text-fill-color:var(--t1);color:var(--t1)">'+(res.p<0.001?'<0.001':fmt(res.p,3))+'</div><div class="sl">p-value</div></div>'+
   '<div class="sc"><div class="sv" style="background:none;-webkit-text-fill-color:var(--t1);color:var(--t1)">'+fmt(res.I2,0)+'%</div><div class="sl">I²</div></div>'+
   '<div class="sc"><div class="sv" style="font-size:18px;background:none;-webkit-text-fill-color:var(--t1);color:var(--t1)">'+res.k+'</div><div class="sl">Studies</div></div></div>'+
  '<div class="split">'+
   '<div class="card"><div class="ct">Forest plot</div><div class="svgwrap">'+forestSVG(res)+'</div></div>'+
   '<div class="card"><div class="ct">Funnel plot</div><div class="svgwrap">'+funnelSVG(res)+'</div>'+(res.egger?'<div class="mut" style="margin-top:8px">Egger’s test: intercept '+fmt(res.egger.intercept)+', t='+fmt(res.egger.t)+', p='+fmt(res.egger.p,3)+(res.egger.p<0.1?' — possible small-study effects':' — no strong asymmetry')+'</div>':'')+'</div>'+
  '</div>'+
  '<div class="card"><div class="ct">Heterogeneity & inference</div><div class="tw"><table class="dt"><tbody>'+
   metaRow('Model',res.method==='FE'?'Fixed-effect (IV)':'Random-effects (DL)')+
   metaRow('Pooled '+b.measure+' (95% CI)',fmt(pooled)+' ('+fmt(plo)+' to '+fmt(phi)+')')+
   metaRow('95% Prediction interval',fmt(pilo)+' to '+fmt(pihi))+
   metaRow('Heterogeneity I²','<span class="badge '+hetClass+'">'+fmt(res.I2,0)+'%</span>')+
   metaRow('Cochran Q (df)',fmt(res.Q)+' ('+res.df+'), p='+(res.pHet<0.001?'<0.001':fmt(res.pHet,3)))+
   metaRow('Tau² (between-study var.)',fmt(res.tau2,4))+
   metaRow('Test of overall effect','z='+fmt(res.z)+', p='+(res.p<0.001?'<0.001':fmt(res.p,3)))+
  '</tbody></table></div>'+
  '<div style="display:flex;gap:8px;margin-top:10px"><button class="btn bs bsm" onclick="aiInterpretMeta()" '+(apiKey()?'':'disabled')+'>✨ AI interpretation</button><button class="btn bs bsm" onclick="dlForest()">Download forest SVG</button></div>'+
  '<div id="metaInterp"></div></div>';
}
function metaRow(k,v){return '<tr><td style="font-weight:600;width:240px">'+esc(k)+'</td><td>'+v+'</td></tr>';}
function forestSVG(res){
 var ratio=res.ratio;var disp=function(v){return ratio?Math.exp(v):v;};
 var rows=res.rows;var W=560,rowH=24,top=30,H=top+rows.length*rowH+70;
 var allLo=rows.map(function(r){return r.ciLo}).concat([res.ciLo,res.piLo]);
 var allHi=rows.map(function(r){return r.ciHi}).concat([res.ciHi,res.piHi]);
 var mn=Math.min.apply(null,allLo),mx=Math.max.apply(null,allHi);
 if(ratio){mn=Math.min(mn,Math.log(0.5));mx=Math.max(mx,Math.log(2));}else{var pad=(mx-mn)*0.1||1;}
 var nameW=150,plotL=nameW+10,plotW=260,plotR=plotL+plotW,valX=plotR+10;
 function xp(v){return plotL+(v-mn)/(mx-mn)*plotW;}
 var nullV=ratio?0:0;var nullX=xp(nullV);
 var s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" font-family="DM Sans,sans-serif" style="max-width:100%">';
 s+='<line x1="'+nullX+'" y1="'+top+'" x2="'+nullX+'" y2="'+(top+rows.length*rowH+8)+'" stroke="#bbb" stroke-dasharray="3 3"/>';
 s+='<text x="6" y="20" font-size="11" font-weight="700" fill="#333">Study</text><text x="'+valX+'" y="20" font-size="11" font-weight="700" fill="#333">'+esc(res.measure)+' [95% CI]</text>';
 rows.forEach(function(r,i){
   var y=top+i*rowH+rowH/2;
   var lo=xp(r.ciLo),hi=xp(r.ciHi),pt=xp(r.yi);
   var sz=4+Math.sqrt(r.w)/2;
   s+='<text x="6" y="'+(y+3)+'" font-size="10" fill="#333">'+esc(r.label.slice(0,26))+'</text>';
   s+='<line x1="'+lo+'" y1="'+y+'" x2="'+hi+'" y2="'+y+'" stroke="#3b82f6" stroke-width="1.5"/>';
   s+='<rect x="'+(pt-sz)+'" y="'+(y-sz)+'" width="'+(sz*2)+'" height="'+(sz*2)+'" fill="#1e40af"/>';
   s+='<text x="'+valX+'" y="'+(y+3)+'" font-size="9" fill="#444">'+fmt(disp(r.yi))+' ['+fmt(disp(r.ciLo))+', '+fmt(disp(r.ciHi))+']</text>';
 });
 var dy=top+rows.length*rowH+20;
 var dlo=xp(res.ciLo),dhi=xp(res.ciHi),dmid=xp(res.est);
 s+='<polygon points="'+dmid+','+(dy-7)+' '+dhi+','+dy+' '+dmid+','+(dy+7)+' '+dlo+','+dy+'" fill="#10b981"/>';
 s+='<text x="6" y="'+(dy+3)+'" font-size="10" font-weight="700" fill="#111">Overall ('+(res.method==='FE'?'FE':'RE')+')</text>';
 s+='<text x="'+valX+'" y="'+(dy+3)+'" font-size="9" font-weight="700" fill="#111">'+fmt(disp(res.est))+' ['+fmt(disp(res.ciLo))+', '+fmt(disp(res.ciHi))+']</text>';
 // prediction interval line
 var py=dy+16;s+='<line x1="'+xp(res.piLo)+'" y1="'+py+'" x2="'+xp(res.piHi)+'" y2="'+py+'" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 2"/><text x="6" y="'+(py+3)+'" font-size="8" fill="#b45309">95% PI</text>';
 var axisY=py+18;s+='<line x1="'+plotL+'" y1="'+axisY+'" x2="'+plotR+'" y2="'+axisY+'" stroke="#999"/>';
 [mn,(mn+mx)/2,mx].forEach(function(t){s+='<text x="'+xp(t)+'" y="'+(axisY+12)+'" font-size="8" fill="#666" text-anchor="middle">'+fmt(disp(t))+'</text>';});
 s+='<text x="'+(plotL+plotW/2)+'" y="'+(axisY+26)+'" font-size="9" fill="#666" text-anchor="middle">'+(ratio?'Favours ← '+esc(res.measure)+' → ':esc(res.measure))+'</text>';
 s+='</svg>';return s;
}
function funnelSVG(res){
 var W=360,H=300,pad=44;var rows=res.rows;
 var es=rows.map(function(r){return r.yi});var ses=rows.map(function(r){return r.sei});
 var minE=Math.min.apply(null,es.concat([res.est])),maxE=Math.max.apply(null,es.concat([res.est]));
 var rng=(maxE-minE)||1;minE-=rng*0.3;maxE+=rng*0.3;
 var maxSE=Math.max.apply(null,ses)*1.1||1;
 function xp(e){return pad+(e-minE)/(maxE-minE)*(W-2*pad);}
 function yp(se){return pad+se/maxSE*(H-2*pad);}
 var s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" font-family="DM Sans" style="max-width:100%">';
 var cx=xp(res.est);
 // pseudo 95% CI funnel
 s+='<line x1="'+cx+'" y1="'+yp(0)+'" x2="'+cx+'" y2="'+yp(maxSE)+'" stroke="#ccc" stroke-dasharray="3 3"/>';
 var topY=yp(0),botSE=maxSE;
 s+='<polygon points="'+cx+','+yp(0)+' '+xp(res.est-1.96*botSE)+','+yp(botSE)+' '+xp(res.est+1.96*botSE)+','+yp(botSE)+'" fill="none" stroke="#bbb" stroke-dasharray="2 2"/>';
 rows.forEach(function(r){s+='<circle cx="'+xp(r.yi)+'" cy="'+yp(r.sei)+'" r="4" fill="#3b82f6" opacity="0.75"/>';});
 s+='<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="#999"/><line x1="'+pad+'" y1="'+pad+'" x2="'+pad+'" y2="'+(H-pad)+'" stroke="#999"/>';
 s+='<text x="'+(W/2)+'" y="'+(H-10)+'" font-size="9" fill="#666" text-anchor="middle">Effect ('+(res.ratio?'log '+esc(res.measure):esc(res.measure))+')</text>';
 s+='<text x="12" y="'+(H/2)+'" font-size="9" fill="#666" transform="rotate(-90 12 '+(H/2)+')" text-anchor="middle">Standard error</text>';
 s+='</svg>';return s;
}
function dlForest(){if(!_metaResult)return;dl('forest_plot.svg',forestSVG(_metaResult),'image/svg+xml');}
async function aiInterpretMeta(){
 if(!_metaResult){notif('Run meta-analysis first','warn');return;}
 var box=$('metaInterp');box.innerHTML='<div class="aip"><span class="spin"></span> Interpreting…</div>';
 var r=_metaResult;var disp=function(v){return r.ratio?Math.exp(v):v;};
 var ctx='Outcome: '+r.outcome+'\nMeasure: '+r.measure+'\nModel: '+r.method+'\nStudies (k): '+r.k+'\nPooled: '+fmt(disp(r.est))+' (95% CI '+fmt(disp(r.ciLo))+' to '+fmt(disp(r.ciHi))+'), p='+fmt(r.p,4)+'\nI²='+fmt(r.I2,0)+'%, tau²='+fmt(r.tau2,4)+', Q='+fmt(r.Q)+' (df '+r.df+', p='+fmt(r.pHet,3)+')\n95% prediction interval: '+fmt(disp(r.piLo))+' to '+fmt(disp(r.piHi))+(r.egger?'\nEgger intercept p='+fmt(r.egger.p,3):'');

/* ====================== STAGE 10: PRISMA ====================== */
function computePrisma(){
 // Canonical counts derived once from explicit record states (not re-derived ad hoc elsewhere).
 var p=S.prisma;
 var bySrc={db:0,reg:0,other:0};
 S.records.forEach(function(r){if(r.source==='ClinicalTrials.gov'||r.source==='Other registry')bySrc.reg++;else if(r.source==='Citation searching')bySrc.other++;else bySrc.db++;});
 p.id_db=bySrc.db;p.id_reg=bySrc.reg;p.id_other=bySrc.other;
 p.dup_removed=S.records.filter(function(r){return r.dup}).length;
 var active=activeRecords();
 p.screened=active.length;
 p.excl_ts=active.filter(function(r){return r.status==='excluded'}).length;
 var sought=active.filter(function(r){return r.status==='included'||r.status==='maybe'});
 p.sought=sought.length;
 p.not_retrieved=sought.filter(function(r){return r.ftStatus==='excluded'&&r.ftReason==='Full text unavailable'}).length;
 var assessed=sought.filter(function(r){return !(r.ftStatus==='excluded'&&r.ftReason==='Full text unavailable')});
 p.assessed=assessed.length;
 var reasons={};assessed.forEach(function(r){if(r.ftStatus==='excluded'&&r.ftReason){reasons[r.ftReason]=(reasons[r.ftReason]||0)+1;}});
 p.excl_ft=reasons;
 p.included=assessed.filter(function(r){return r.ftStatus==='included'}).length;
 // if full-text step not used, included = TiAb-included
 if(p.included===0&&assessed.length>0&&!S.done.fulltext)p.included=assessed.filter(function(r){return r.status==='included'}).length;
 persist();return p;
}

function prismaSVG(p){
 var totId=p.id_db+p.id_reg+p.id_other;
 var box=function(x,y,w,h,lines,fill){var s='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="6" fill="'+(fill||'#eef3fb')+'" stroke="#9bb4d6"/>';lines.forEach(function(ln,i){s+='<text x="'+(x+10)+'" y="'+(y+20+i*15)+'" font-size="11" fill="#1a2b45">'+esc(ln)+'</text>';});return s;};
 var arrow=function(x1,y1,x2,y2){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#7089aa" stroke-width="1.5" marker-end="url(#ah)"/>';};
 var W=720,H=560;
 var s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" font-family="DM Sans" style="max-width:100%"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7089aa"/></marker></defs>';
 var cx=40,cw=320;
 s+=box(cx,20,cw,60,['Records identified (n = '+totId+'):','  Databases n='+p.id_db+', Registers n='+p.id_reg,'  Other sources n='+p.id_other],'#dbe7fb');
 s+=box(cx,120,cw,40,['Records screened (title/abstract)','n = '+p.screened]);
 s+=box(cx,210,cw,40,['Reports sought for retrieval','n = '+p.sought]);
 s+=box(cx,300,cw,40,['Reports assessed for eligibility','n = '+p.assessed]);
 s+=box(cx,400,cw,50,['Studies included in review','n = '+p.included],'#dcfce7');
 // right-side exclusions
 var rx=440,rw=250;
 s+=box(rx,90,rw,40,['Duplicate records removed','n = '+p.dup_removed],'#fdeaea');
 s+=box(rx,165,rw,40,['Records excluded (T/A)','n = '+p.excl_ts],'#fdeaea');
 s+=box(rx,255,rw,40,['Reports not retrieved','n = '+p.not_retrieved],'#fdeaea');

   if($('domBadge'))$('domBadge').textContent=dom().badge;
   if($('modeStep'))$('modeStep').classList.toggle('on',S.mode!=='autopilot');
   if($('modeAuto'))$('modeAuto').classList.toggle('on',S.mode==='autopilot');
   setApiStatus(apiKey()?'on':'off');
   render();
   if(!apiKey()&&S.records.length===0){setTimeout(function(){notif('Welcome to EvidenceOS — open ⚙ Settings to add your Claude API key, then pick Device or Drug pipeline.','in');},600);}
 }catch(e){ showFatal(e.message); }
}
init();
/* end EvidenceOS */
</script>
</body>
</html>
